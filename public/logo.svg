<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 6 Rayos de luz lineales discontinuos -->
  <g stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="50" y1="6" x2="50" y2="16" />
    <line x1="84" y1="24" x2="76" y2="32" />
    <line x1="94" y1="52" x2="84" y2="52" />
    <line x1="16" y1="24" x2="24" y2="32" />
    <line x1="6" y1="52" x2="16" y2="52" />
    <line x1="50" y1="94" x2="50" y2="86" opacity="0.4" />
  </g>
  
  <!-- Cuerpo de bombilla estilizada -->
  <path d="M50 76 C36 76 28 66 28 50 C28 36 38 24 50 24 C62 24 72 36 72 50 C72 66 64 76 50 76 Z" stroke="#FFD700" stroke-width="2.5" fill="none" filter="url(#glow)" />
  
  <!-- Filamento interno en espiral perfecta -->
  <path d="M50 48 C50 43 55 40 58 43 C62 47 55 56 48 53 C40 50 45 38 55 36 C65 34 72 46 65 58 C58 70 42 68 36 53" stroke="#FFD700" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Base de la bombilla -->
  <rect x="42" y="77" width="16" height="4" rx="2" fill="#FFD700" />
  <rect x="44" y="82" width="12" height="3" rx="1.5" fill="#FFD700" opacity="0.8" />
</svg>
